<form class="form" (ngSubmit)="onSubmit()">
  <div class="field">
    <label>
      Language
      <select
        name="language"
        [ngModel]="language()"
        (ngModelChange)="languageChange.emit($event)"
        [ngModelOptions]="{ standalone: true }"
        [attr.aria-invalid]="languageError() ? 'true' : null"
        [attr.aria-describedby]="languageError() ? 'language-error' : null"
      >
        @for (opt of languageOptions; track opt) {
          <option [value]="opt">{{ opt }}</option>
        }
      </select>
    </label>
    @if (languageError(); as err) {
      <div id="language-error" class="fieldError" role="alert">{{ err }}</div>
    }
  </div>

  <div class="field">
    <label>
      Changed after (YYYY-MM-DD)
      <input
        type="date"
        name="changedAfter"
        [ngModel]="changedAfter()"
        (ngModelChange)="changedAfterChange.emit($event)"
        [ngModelOptions]="{ standalone: true }"
        [attr.aria-invalid]="changedAfterError() ? 'true' : null"
        [attr.aria-describedby]="changedAfterError() ? 'changed-after-error' : null"
      />
    </label>
    @if (changedAfterError(); as err) {
      <div id="changed-after-error" class="fieldError" role="alert">{{ err }}</div>
    }
  </div>

  <button type="submit" [disabled]="isLoading()">
    @if (isLoading()) { Loading… } @else { Search }
  </button>
</form>
