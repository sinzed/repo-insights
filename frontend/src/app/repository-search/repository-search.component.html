<div class="panel">
  <app-repository-search-form
    [language]="language()"
    [changedAfter]="changedAfter()"
    [isLoading]="isLoading()"
    [languageError]="languageFieldError()"
    [changedAfterError]="changedAfterFieldError()"
    (languageChange)="onLanguageChange($event)"
    (changedAfterChange)="onChangedAfterChange($event)"
    (search)="search()"
  />

  @if (error()) {
    <div class="error">{{ error() }}</div>
  }

  <app-repository-search-status
    [isLoading]="isLoading()"
    [hasSearched]="hasSearched()"
    [itemsLength]="items().length"
    [hasError]="hasError()"
    [page]="page()"
    [totalPages]="totalPages()"
    [totalCount]="totalCount()"
  />

  @if (hasSearched()) {
    <app-repository-pager
      [page]="page()"
      [totalPages]="totalPages()"
      [perPage]="perPage()"
      [pageSizeOptions]="pageSizeOptions"
      [isLoading]="isLoading()"
      (previous)="goToPreviousPage()"
      (next)="goToNextPage()"
      (perPageChange)="onPerPageChange($event)"
    />
  }

  <div class="listRegion" [class.listRegionLoading]="isLoading() && hasSearched()">
    <app-repository-list [items]="items()" />
  </div>
</div>
